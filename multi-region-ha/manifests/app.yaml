# Rendered per cluster by create.sh (@NEG_NAME@, @REGION@ substituted).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels: {app: web}
spec:
  replicas: 3
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {app: web, region: "@REGION@"}
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app: web}
      containers:
        - name: web
          image: nginxinc/nginx-unprivileged:stable
          ports: [{containerPort: 8080}]
          resources:
            requests: {cpu: 250m, memory: 256Mi, ephemeral-storage: 256Mi}
            limits: {cpu: 250m, memory: 256Mi, ephemeral-storage: 256Mi}
          readinessProbe:
            httpGet: {path: /, port: 8080}
            periodSeconds: 5
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: web
spec:
  minAvailable: 2
  selector:
    matchLabels: {app: web}
---
apiVersion: v1
kind: Service
metadata:
  name: web
  annotations:
    cloud.google.com/neg: '{"exposed_ports":{"80":{"name":"@NEG_NAME@"}}}'
spec:
  type: ClusterIP
  selector: {app: web}
  ports:
    - port: 80
      targetPort: 8080
