# Global external Application LB (gke-l7-global-external-managed): the class that supports
# Certificate Manager cert maps (Google-managed TLS) + Cloud Armor via GCPBackendPolicy.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: __NAME__-gw
  annotations: {networking.gke.io/certmap: __CERTMAP__}
spec:
  gatewayClassName: gke-l7-global-external-managed
  addresses: [{type: NamedAddress, value: __IPNAME__}]
  listeners:
    - {name: https, protocol: HTTPS, port: 443, allowedRoutes: {kinds: [{kind: HTTPRoute}]}}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: __NAME__-route}
spec:
  parentRefs: [{name: __NAME__-gw}]
  hostnames: ["__DOMAIN__"]
  rules:
    - backendRefs: [{name: __NAME__-app, port: 80}]
---
apiVersion: networking.gke.io/v1
kind: GCPBackendPolicy
metadata: {name: __NAME__-armor}
spec:
  default: {securityPolicy: __POLICY__}
  targetRef: {group: "", kind: Service, name: __NAME__-app}
